name: Deploy Sun App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sanitize username: strip email domain, lowercase, remove whitespace
      - name: Compute image name
        id: img
        run: |
          RAW='${{ secrets.DOCKER_USERNAME }}'
          NAME=$(printf '%s' "${RAW%%@*}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "Computed image name: ${NAME}/sun"
          echo "value=${NAME}/sun" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push to Docker Hub (runner has unrestricted internet access)
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.value }}:latest
            ${{ steps.img.outputs.value }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull on the runner (not the server), then save as a compressed tar
      # Save to workspace dir so appleboy/scp-action (runs in Docker) can access it
      - name: Save image as tar.gz
        run: |
          docker pull ${{ steps.img.outputs.value }}:latest
          docker save ${{ steps.img.outputs.value }}:latest | gzip > sun.tar.gz
          ls -lh sun.tar.gz

      # SCP transfers directly over SSH — no Docker Hub needed on the server
      - name: Copy image to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: sun.tar.gz
          target: /tmp/

      - name: Load image and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker load -i /tmp/sun.tar.gz

            docker stop sun 2>/dev/null || true
            docker rm   sun 2>/dev/null || true

            docker run -d \
              --name sun \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ steps.img.outputs.value }}:latest

            docker image prune -f
            rm -f /tmp/sun.tar.gz
