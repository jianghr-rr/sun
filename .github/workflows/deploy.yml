name: Deploy Sun App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Strip email domain if user accidentally put an email, then lowercase
      - name: Compute image name
        id: img
        run: |
          RAW='${{ secrets.DOCKER_USERNAME }}'
          # If it looks like an email, keep only the local part before @
          NAME=$(printf '%s' "${RAW%%@*}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "Computed image name: ${NAME}/sun"
          echo "value=${NAME}/sun" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.value }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Compute image name
        id: img
        run: |
          RAW='${{ secrets.DOCKER_USERNAME }}'
          NAME=$(printf '%s' "${RAW%%@*}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "value=${NAME}/sun" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ steps.img.outputs.value }}:latest

            docker stop sun 2>/dev/null || true
            docker rm   sun 2>/dev/null || true

            docker run -d \
              --name sun \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ steps.img.outputs.value }}:latest

            docker image prune -f
